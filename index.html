<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Treino e Ballet</title>
<meta name="theme-color" id="tc" content="#f4f5f8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Treino">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
/* Fontes guardadas junto do app (licença OFL): DM Sans e Manrope */
@font-face{font-family:"DM Sans";font-weight:400;font-style:normal;font-display:swap;src:url("fonts/dmsans-400.woff") format("woff")}
@font-face{font-family:"DM Sans";font-weight:500;font-style:normal;font-display:swap;src:url("fonts/dmsans-500.woff") format("woff")}
@font-face{font-family:"DM Sans";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/dmsans-600.woff") format("woff")}
@font-face{font-family:"DM Sans";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/dmsans-700.woff") format("woff")}
@font-face{font-family:"Manrope";font-weight:600;font-style:normal;font-display:swap;src:url("fonts/manrope-600.woff") format("woff")}
@font-face{font-family:"Manrope";font-weight:700;font-style:normal;font-display:swap;src:url("fonts/manrope-700.woff") format("woff")}
@font-face{font-family:"Manrope";font-weight:800;font-style:normal;font-display:swap;src:url("fonts/manrope-800.woff") format("woff")}

:root{
  --shell:520px;
  --f-body:"DM Sans",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Manrope","DM Sans",ui-rounded,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --bg:#f4f5f8; --surface:#ffffff; --surface-2:#e9ecf3; --text:#111b3c; --muted:#69718a; --border:#dde1ea;
  --accent:rgb(175,120,249); --accent-2:#c9ff3d; --accent-soft:#f0e7ff;
  --ballet:#cf326e; --ballet-card:rgb(207,50,165); --ballet-soft:#fbe1ec;
  --success:#168f68; --danger:#d84747; --shadow:0 14px 40px rgba(26,35,67,.1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#090e1e; --surface:#141b31; --surface-2:#202942; --text:#f7f8ff; --muted:#9da6c0; --border:#2a334d;
    --accent-soft:#3a2854; --ballet-soft:#4a1b33; --success:#39ce99; --danger:#ff7777; --shadow:0 18px 46px rgba(0,0,0,.28);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#090e1e; --surface:#141b31; --surface-2:#202942; --text:#f7f8ff; --muted:#9da6c0; --border:#2a334d;
  --accent-soft:#3a2854; --ballet-soft:#4a1b33; --success:#39ce99; --danger:#ff7777; --shadow:0 18px 46px rgba(0,0,0,.28);
  color-scheme:dark;
}
.is-ballet{--accent:var(--ballet);--accent-soft:var(--ballet-soft)}

*,::before,::after{box-sizing:border-box;border:0 solid;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.5;font-synthesis:none}
h1,h2,p,ol{margin:0}
ol{padding:0;list-style:none}
h1,h2,strong{font-family:var(--f-head)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;letter-spacing:inherit;color:inherit}
button{cursor:pointer;padding:0;background:transparent}
svg{display:block}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.phone-shell{width:min(100%,var(--shell));min-height:100vh;margin:0 auto;
  padding:0 max(18px,env(safe-area-inset-right,0px)) calc(118px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px))}
body.timer-on .phone-shell{padding-bottom:calc(250px + env(safe-area-inset-bottom,0px))}

/* ---------- cabeçalho ---------- */
.page-header{padding:22px 0 18px}
.header-top{min-height:44px;display:flex;align-items:center;justify-content:space-between}
.eyebrow,.kicker{color:var(--accent);font-size:12px;font-weight:800;letter-spacing:.12em}
h1{margin-top:8px;font-size:clamp(35px,10vw,46px);line-height:1.02;letter-spacing:-.045em}
.page-intro{max-width:330px;margin:-8px 0 24px;color:var(--muted);font-size:17px;line-height:1.45}
.back-button{display:flex;align-items:center;gap:4px;min-height:44px;padding:0;border:0;color:var(--muted);font-weight:700}
.round-button{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--border);border-radius:50%;background:var(--surface)}
.muted{color:var(--muted)}
.vazio{display:grid;gap:12px;padding:22px;border:1px solid var(--border);border-radius:24px;background:var(--surface)}
.vazio p{color:var(--muted);line-height:1.45}

/* ---------- botões ---------- */
.primary-button{display:flex;align-items:center;justify-content:center;gap:9px;width:100%;min-height:60px;padding:0 22px;border:0;border-radius:18px;background:var(--accent);color:#fff;font-family:var(--f-head);font-size:16px;font-weight:800}
.primary-button:disabled{opacity:.45;cursor:not-allowed}
.primary-button.ballet-button{background:var(--ballet)}
.bottom-action{margin-top:24px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:44px;padding:0 16px;border:1px solid var(--border);border-radius:13px;background:var(--bg);font-size:14px;font-weight:800}
.chips button.selected{border-color:var(--accent);background:var(--accent);color:#fff}
.done-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:20px;padding:14px 14px 14px 18px;border-radius:20px;background:color-mix(in srgb,var(--success) 14%,var(--surface));color:var(--success);font-weight:800}
.done-banner>span{display:flex;align-items:center;gap:8px}
.done-banner button{min-height:44px;padding:0 15px;border-radius:12px;background:var(--surface);color:var(--text);font-weight:800}
.workout-list+.primary-button{margin-top:18px}

/* ---------- Hoje ---------- */
.monthly-goal{margin-bottom:22px}
.monthly-goal-card{display:grid;grid-template-columns:62px 1fr 44px;align-items:center;gap:14px;min-height:94px;padding:15px;border:1px solid var(--border);border-radius:22px;background:var(--surface)}
.goal-ring{display:grid;place-items:center;width:62px;height:62px;border-radius:50%;background:conic-gradient(var(--accent-2) var(--goal-progress),var(--surface-2) 0)}
.goal-ring::before{content:"";grid-area:1/1;width:46px;height:46px;border-radius:50%;background:var(--surface)}
.goal-ring>div{z-index:1;grid-area:1/1;display:grid;place-items:center}
.goal-ring strong{font-size:17px;line-height:1}
.goal-ring span{margin-top:2px;color:var(--muted);font-size:10px}
.goal-copy{display:grid;align-content:center}
.goal-copy>span{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.12em}
.goal-copy>strong{margin-top:5px;font-size:15px;line-height:1.2}
.goal-copy p{margin-top:2px;color:var(--muted);font-size:12px}
.goal-edit-button{display:grid;place-items:center;width:44px;height:44px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--accent)}
.goal-editor{display:grid;gap:10px;margin-top:10px;padding:15px;border:1px solid var(--border);border-radius:20px;background:var(--surface)}
.goal-editor label{display:block;margin:0 0 7px 2px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.06em}
.goal-editor p{color:var(--muted);font-size:13px;line-height:1.45}
.today-plans{display:grid;gap:13px}
.plan-card{display:block;width:100%;min-height:178px;padding:22px;border-radius:26px;color:#fff;text-align:left}
.plan-card.strength{background:var(--accent);box-shadow:0 18px 40px color-mix(in srgb,var(--accent) 22%,transparent)}
.plan-card.ballet{background:var(--ballet-card)}
.plan-type{display:block;margin-bottom:18px;color:rgba(255,255,255,.85);font-size:11px;font-weight:800;letter-spacing:.12em}
.plan-card>strong{display:block;font-size:23px;letter-spacing:-.03em}
.plan-card>p{margin-top:4px;color:rgba(255,255,255,.88);font-size:15px}
.hero-progress{height:8px;margin-top:20px;overflow:hidden;border-radius:9px;background:rgba(255,255,255,.22)}
.hero-progress span{display:block;height:100%;border-radius:inherit;background:var(--accent-2)}
.hero-footer{display:flex;align-items:center;justify-content:space-between;margin:8px 0 0;font-size:12px}
.hero-footer svg{width:20px}
.class-log{margin-top:18px;padding:21px;border:1px solid var(--border);border-radius:26px;background:var(--surface)}
.section-heading{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:15px}
.section-heading h2{margin-top:3px;font-size:24px;letter-spacing:-.035em}
.section-heading.compact{align-items:center;margin-bottom:13px}
.section-heading.compact>span{color:var(--muted);font-size:13px}
.class-log label{display:block;margin:19px 0 8px 2px;color:var(--muted);font-size:13px;font-weight:700}
.class-log textarea{width:100%;min-height:100px;margin:18px 0 14px;padding:14px;resize:vertical;border:1px solid var(--border);border-radius:16px;outline:none;background:var(--bg);color:var(--text);line-height:1.45}
.class-log textarea:focus{border-color:var(--ballet)}
.feeling-picker{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.feeling-picker button{min-width:0;min-height:48px;padding:0 2px;border:1px solid var(--border);border-radius:13px;background:var(--bg);font-size:12px;font-weight:800}
.feeling-picker button.selected{border-color:var(--ballet);background:var(--ballet);color:#fff}

/* ---------- contador ---------- */
.counter{display:grid;grid-template-columns:44px 1fr 44px;align-items:center;min-height:64px;border-radius:17px;background:var(--surface-2)}
.counter button{display:grid;place-items:center;width:44px;height:52px;padding:0;border:0;background:transparent;color:var(--accent)}
.counter strong{display:flex;align-items:baseline;justify-content:center;min-width:0;font-size:28px;letter-spacing:-.04em}
.cnt-input{min-width:0;padding:0;border:0;border-radius:8px;background:transparent;text-align:center;font:inherit;font-size:28px;color:var(--text);font-variant-numeric:tabular-nums;-webkit-appearance:none;appearance:none}
.cnt-input:focus{outline:2px solid var(--accent);outline-offset:2px}
.counter small{margin-left:3px;color:var(--muted);font-family:var(--f-body);font-size:12px;font-weight:400}

/* ---------- Treinos ---------- */
.workout-list{display:grid;gap:13px}
.workout-card{display:flex;align-items:stretch;min-height:128px;border:1px solid var(--border);border-radius:24px;background:var(--surface);overflow:hidden}
.workout-card.ballet{--accent:var(--ballet);--accent-soft:var(--ballet-soft)}
.workout-card.featured{border-color:var(--accent);box-shadow:0 12px 35px color-mix(in srgb,var(--accent) 13%,transparent)}
.workout-main{display:flex;flex:1;align-items:center;gap:13px;min-width:0;padding:18px 10px 18px 16px;text-align:left}
.workout-card>svg{align-self:center;flex:none;margin:0 11px 0 3px;color:var(--muted)}
.workout-letter{display:grid;place-items:center;flex:none;width:48px;height:62px;border-radius:16px;background:var(--surface-2);color:var(--accent);font-family:var(--f-head);font-size:24px;font-weight:800}
.workout-card.featured .workout-letter{background:var(--accent);color:#fff}
.workout-copy{display:flex;flex:1;flex-direction:column;min-width:0}
.workout-copy small{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.workout-copy strong{margin:4px 0;font-size:18px}
.workout-copy span{color:var(--muted);font-size:13px}
.workout-edit-button{display:grid;place-items:center;align-self:center;flex:none;width:44px;height:44px;border-radius:13px;background:var(--accent-soft);color:var(--accent)}

/* ---------- Treino do dia ---------- */
.title-meta{margin-top:-11px;margin-bottom:23px}
.title-meta span,.exercise-tags span{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:.12em}
.title-meta p{margin-top:5px;color:var(--muted)}
.exercise-rows{overflow:hidden;border-radius:22px;background:var(--surface)}
.exercise-row{display:flex;align-items:center;width:100%;min-height:91px;padding:13px;gap:13px;border-bottom:1px solid var(--border);background:var(--surface);text-align:left}
.exercise-row:last-child{border-bottom:0}
.order{display:grid;place-items:center;flex:none;width:42px;height:42px;border-radius:13px;background:var(--surface-2);color:var(--muted);font-weight:800}
.order.completed{background:color-mix(in srgb,var(--success) 18%,var(--surface));color:var(--success)}
.exercise-copy{display:grid;flex:1;gap:4px;min-width:0}
.exercise-copy strong{font-size:16px}
.exercise-copy small{color:var(--muted);font-size:13px}
.exercise-row>svg{color:var(--muted)}

/* ---------- Exercício ---------- */
.exercise-tags{display:flex;flex-wrap:wrap;gap:8px;margin:-8px 0 22px}
.exercise-tags span{padding:7px 10px;border-radius:8px;background:var(--surface-2)}
.video-button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;margin-bottom:13px;padding:0 17px;border-radius:15px;background:var(--accent-soft);color:var(--accent);font-weight:800;width:max-content;max-width:100%}
.rest-card{position:fixed;z-index:12;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  display:grid;grid-template-columns:1fr 64px 76px;align-items:center;width:min(calc(100% - 36px),calc(var(--shell) - 36px));min-height:112px;padding:0 0 0 20px;
  border-radius:24px;overflow:hidden;background:var(--accent-2);color:#14200a;box-shadow:0 16px 42px rgba(18,26,8,.24);animation:rest-card-in .25s ease-out}
.rest-card[hidden]{display:none}
.rest-card>div:first-child{display:grid}
.rest-label{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.1em}
.rest-time{margin-top:3px;font-size:46px;line-height:1;letter-spacing:-.04em}
.timer-ring{display:grid;place-items:center;width:54px;height:54px;border:5px solid rgba(20,32,10,.18);border-top-color:#14200a;border-radius:50%;transform:rotate(var(--progress,0deg))}
.timer-ring svg{transform:rotate(calc(var(--progress,0deg) * -1))}
.rest-card>button{align-self:stretch;min-height:112px;padding:0;border:0;border-left:1px solid rgba(20,32,10,.13);background:rgba(20,32,10,.12);color:#14200a;font-size:13px;font-weight:800}
@keyframes rest-card-in{from{opacity:0;transform:translate(-50%,12px) scale(.98)}to{opacity:1;transform:translate(-50%,0) scale(1)}}
@media (prefers-reduced-motion:reduce){.rest-card{animation:none}}
.machine-card{display:flex;gap:13px;margin-top:13px;padding:17px;border:1px solid var(--border);border-radius:20px;background:var(--surface)}
.machine-icon{display:grid;place-items:center;flex:none;width:44px;height:44px;border-radius:14px;background:var(--accent-soft);color:var(--accent)}
.machine-card>div{display:grid;flex:1;gap:3px;min-width:0}
.machine-card small{color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em}
.machine-card textarea{width:100%;min-height:44px;padding:4px 0;resize:none;overflow:hidden;border:0;outline:none;background:transparent;color:var(--text);font-size:16px;line-height:1.4}
.machine-card textarea::placeholder{color:var(--muted)}
.machine-card:focus-within{border-color:var(--accent)}
.suggestion-card{display:grid;gap:4px;margin-top:13px;padding:18px;border-radius:20px;background:var(--accent-soft)}
.suggestion-card strong{font-size:18px}
.suggestion-card p{color:var(--muted);font-size:13px;line-height:1.45}
.current-load{margin-top:25px;padding:18px;border:1px solid var(--border);border-radius:22px;background:var(--surface)}
.current-load>button{min-height:44px;margin-top:10px;padding:0 13px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:800}
.sets-section{margin-top:27px}
.set-card{margin-bottom:14px;padding:17px;border:1px solid var(--border);border-radius:24px;background:var(--surface)}
.set-card.set-done{border-color:color-mix(in srgb,var(--success) 55%,var(--border))}
.set-title{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.1em}
.set-title b{display:flex;align-items:center;gap:4px;color:var(--success);font-family:var(--f-body)}
.set-counters{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set-counters label{display:block;margin:0 0 7px 3px;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em}
.set-counters .counter{grid-template-columns:38px 1fr 38px;min-height:60px}
.set-counters .counter button{width:38px}
.complete-button{display:flex;align-items:center;justify-content:center;width:100%;min-height:53px;margin-top:13px;border:0;border-radius:15px;background:var(--accent);color:#fff;font-weight:800;gap:7px}
.complete-button.is-done{background:color-mix(in srgb,var(--success) 16%,var(--surface));color:var(--success)}

/* ---------- Evolução ---------- */
.chart-card{padding:17px 15px 8px;border:1px solid var(--border);border-radius:24px;background:var(--surface)}
.chart-title{position:relative;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 5px;font-family:var(--f-head);font-weight:800}
.chart-name{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chart-pick{display:grid;place-items:center;flex:none;width:36px;height:36px;border-radius:10px;background:var(--surface-2);transform:rotate(90deg)}
.chart-select{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px}
.line-chart{width:100%;margin-top:7px;overflow:visible}
.grid line{stroke:var(--border);stroke-width:1;stroke-dasharray:4 5}
.area{fill:url(#area)}
.chart-line{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.line-chart circle{fill:var(--surface);stroke:var(--accent);stroke-width:4}
.axis-label{fill:var(--muted);font-size:10px;font-weight:800;letter-spacing:.05em}
.history-section{margin-top:28px}
.history-list{padding:4px 17px;border-radius:24px;background:var(--surface)}
.history-list article{display:grid;grid-template-columns:18px 1fr auto;align-items:center;min-height:82px;border-bottom:1px solid var(--border)}
.history-list article:last-child{border:0}
.history-mark{width:8px;height:8px;border-radius:50%;background:var(--border)}
.history-mark.latest{background:var(--accent-2);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent-2) 18%,transparent)}
.history-list article>div{display:grid;gap:2px}
.history-list article>div small{color:var(--muted);font-size:12px}
.history-list article>div strong{font-size:18px}
.history-list article p{display:flex;align-items:flex-end;gap:5px;color:var(--muted);font-size:14px}
.history-list article p small{font-size:10px;font-weight:800;letter-spacing:.08em}
.ballet-summary{margin-top:28px}
.ballet-summary>p{padding:20px;border-radius:20px;background:var(--surface);color:var(--muted);line-height:1.5}
.ballet-summary>p strong{color:var(--text)}

/* ---------- formulários ---------- */
.form-section{display:grid;padding:19px;border:1px solid var(--border);border-radius:24px;background:var(--surface)}
.form-section label{margin:0 0 8px 2px;font-family:var(--f-head);font-size:13px;font-weight:800}
.form-section label:not(:first-child){margin-top:22px}
.form-section input,.form-section select{min-height:58px;padding:0 15px;border:1px solid var(--border);border-radius:15px;outline:none;background:var(--bg);color:var(--text);font-size:16px}
.form-section input:focus,.form-section select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.day-picker{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.day-picker button{min-width:0;min-height:48px;padding:0;border:1px solid var(--border);border-radius:13px;background:var(--bg);font-size:12px;font-weight:800}
.day-picker button.selected{border-color:var(--accent);background:var(--accent);color:#fff}
.edit-exercises{margin-top:28px}
.edit-help{max-width:290px;margin-top:5px;color:var(--muted);font-size:12px;line-height:1.4}
.reorder-list{overflow:hidden;border-radius:22px;background:var(--surface)}
.reorder-list article{display:flex;align-items:center;min-height:85px;padding:10px 8px 10px 12px;border-bottom:1px solid var(--border);gap:8px}
.reorder-list article:last-child{border:0}
.reorder-list .order{width:38px;height:38px}
.reorder-text{display:grid;flex:1;gap:3px;min-width:0;padding:6px 0}
.reorder-text strong{font-size:14px}
.reorder-text small{color:var(--muted);font-size:12px}
.reorder-list article>button{display:grid;place-items:center;flex:none;width:42px;height:44px;border-radius:12px;background:var(--surface-2);color:var(--text)}
.reorder-list article>button:disabled{opacity:.3;cursor:default}
.add-exercise{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;min-height:58px;margin-top:12px;border:1px dashed var(--accent);border-radius:17px;background:transparent;color:var(--accent);font-weight:800}
.exercise-form-card{display:grid;padding:18px;border:1px solid var(--border);border-radius:24px;background:var(--surface)}
.exercise-form-card>label:not(:first-child){margin-top:20px}
.exercise-form-card label{margin:0 0 8px 1px;font-family:var(--f-head);font-size:13px;font-weight:800}
.exercise-form-card input{width:100%;min-width:0;min-height:58px;padding:0 14px;border:1px solid var(--border);border-radius:15px;outline:none;background:var(--bg);color:var(--text);font-size:16px}
.exercise-form-card input:focus,.exercise-form-section textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.exercise-form-section{margin-top:28px}
.exercise-form-section>h2{margin-bottom:13px;font-size:23px;letter-spacing:-.035em}
.form-grid-three{grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.form-grid-two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form-grid-three>div,.form-grid-two>div{min-width:0}
.form-grid-three label,.form-grid-two label{display:block;min-height:32px}
.load-form{gap:14px}
.load-form>p{color:var(--muted);font-size:13px;line-height:1.45}
.exercise-form-section>textarea{width:100%;min-height:112px;padding:15px;resize:vertical;border:1px solid var(--border);border-radius:18px;outline:none;background:var(--surface);color:var(--text);font-size:16px;line-height:1.45}
.danger-zone{display:flex;justify-content:center;margin:28px 0}
.danger-zone>button{display:flex;align-items:center;gap:7px;min-height:48px;padding:0 15px;border:0;background:none;color:var(--danger);font-weight:700}
.danger-zone.confirmando{flex-direction:column;align-items:center;gap:14px;text-align:center;padding:18px;border:1px solid var(--danger);border-radius:20px}
.danger-zone.confirmando p{color:var(--text);line-height:1.45}
.confirm-btns{display:flex;gap:10px;width:100%}
.confirm-btns button{flex:1;min-height:52px;border-radius:15px;font-weight:800}
.confirm-btns .ghost{background:var(--surface-2)}
.confirm-btns .danger{background:var(--danger);color:#fff}

/* ---------- Ajustes ---------- */
.settings-card{padding:18px;border:1px solid var(--border);border-radius:22px;background:var(--surface)}
.settings-card-row{display:flex;align-items:center;gap:12px}
.settings-card-row>div{display:grid;gap:3px}
.settings-card p{color:var(--muted);font-size:13px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:14px;padding:4px;border-radius:15px;background:var(--surface-2)}
.seg button{min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);font-size:13px;font-weight:800}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.settings-intro{margin:-10px 0 22px;color:var(--muted);font-size:14px}
.settings-section{margin-top:30px}
.settings-section-heading{display:flex;align-items:flex-start;gap:12px;margin-bottom:14px}
.settings-section-icon{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:13px;background:var(--accent-soft);color:var(--accent)}
.settings-section-heading h2{font-size:20px;letter-spacing:-.03em}
.settings-section-heading p{margin-top:4px;color:var(--muted);font-size:13px;line-height:1.45}
.sync-form{display:grid;padding:18px;border:1px solid var(--border);border-radius:22px;background:var(--surface)}
.sync-form label{margin:0 0 7px 2px;font-size:12px;font-weight:800}
.sync-form label:not(:first-child){margin-top:16px}
.sync-form input{min-height:52px;padding:0 14px;border:1px solid var(--border);border-radius:14px;outline:none;background:var(--bg);color:var(--text);font-size:16px}
.sync-form input:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 14%,transparent)}
.settings-actions{display:grid;gap:10px;margin-top:18px}
.settings-primary-action{display:flex;align-items:center;justify-content:center;gap:7px;min-height:52px;border:0;border-radius:15px;background:var(--accent);color:#fff;font-weight:800}
.settings-primary-action.sec{background:var(--accent-soft);color:var(--accent)}
.settings-primary-action.out{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.connection-status{display:flex;align-items:flex-start;gap:7px;margin-top:12px;color:var(--muted);font-size:13px}
.connection-status .dot{flex:none;width:7px;height:7px;margin-top:6px;border-radius:50%;background:var(--muted)}
.connection-status.connected{color:var(--success)}
.connection-status.connected .dot{background:var(--success)}
.connection-status.erro{color:var(--danger)}
.connection-status.erro .dot{background:var(--danger)}
.backup-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.backup-actions button,.backup-actions label{display:flex;align-items:center;justify-content:center;gap:7px;min-height:56px;margin:0;border:0;border-radius:16px;background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:800;text-align:center;cursor:pointer}
.backup-actions label input{display:none}
.shortcut-steps{margin:0 0 14px;padding-left:28px;list-style:decimal;color:var(--muted);font-size:13px;line-height:1.65}
.reminder-url{display:grid;gap:11px;width:100%;padding:16px;border:1px solid var(--border);border-radius:18px;background:var(--surface);text-align:left}
.reminder-url>span:first-child{overflow:hidden;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}
.reminder-url>span:last-child{display:flex;align-items:center;gap:6px;color:var(--accent);font-size:13px;font-weight:800}

/* ---------- menu e aviso ---------- */
.bottom-nav{position:fixed;z-index:10;bottom:0;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,1fr);width:min(100%,var(--shell));height:calc(80px + env(safe-area-inset-bottom,0px));
  padding:6px max(18px,env(safe-area-inset-right,0px)) max(6px,env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  border-top:1px solid var(--border);background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.bottom-nav a{position:relative;display:grid;place-items:center;align-content:center;gap:4px;color:var(--muted)}
.bottom-nav a span{font-size:11px;font-weight:800}
.bottom-nav a[aria-current="page"]{color:var(--accent)}
.bottom-nav a[aria-current="page"]::before{content:"";position:absolute;top:4px;width:54px;height:35px;border-radius:14px;background:var(--accent-soft);z-index:-1}
#toast{position:fixed;z-index:14;left:50%;bottom:calc(98px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);width:max-content;max-width:calc(100% - 36px);text-align:center;padding:12px 18px;border-radius:14px;background:var(--text);color:var(--bg);font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>
</head>

  <div><span class="rest-label"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span id="rest-txt">DESCANSO</span></span><strong class="rest-time" id="rest-time">0:00</strong></div>
  <div class="timer-ring" id="rest-ring"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22c4 0 7-3 7-7 0-3-1.5-5.5-4-8 .2 2-1 3.5-2 4-1-3-3-6-5-8 .3 4-3 6-3 11 0 4.5 3 8 7 8Z"/></svg></div>

  <a href="#/ajustes" data-tab="ajustes"><svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.6-1H3v-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6V3h4v.1A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.6 1h.1v4H21a1.7 1.7 0 0 0-1.6 1Z"/></svg><span>Ajustes</span></a>
</nav>
<noscript>Este app precisa de JavaScript.</noscript>

<script>
'use strict';
/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const safeUrl = u => /^https?:\/\//i.test(String(u || '').trim()) ? String(u).trim() : '';
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : 0; };
const fmt = n => String(Number(Number(n).toFixed(2))).replace('.', ',');
const pad = n => String(n).padStart(2, '0');
const hoje = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
const DIAS = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
const ORDEM_DIAS = [1, 2, 3, 4, 5, 6, 0];
const MESES = ['JANEIRO', 'FEVEREIRO', 'MARÇO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];
const MES_CURTO = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
const SENTIR = ['Pesada', 'Difícil', 'Ok', 'Boa', 'Ótima'];
const fmtData = iso => iso === hoje() ? 'Hoje' : (([, m, d]) => `${d} ${MES_CURTO[+m - 1]}`)(iso.split('-'));
const fmtEixo = iso => (([, m, d]) => `${d} ${MES_CURTO[+m - 1].toUpperCase()}`)(iso.split('-'));
const fmtBarra = iso => iso.split('-').slice(1).reverse().join('/');

/* ---------- ícones ---------- */
const ICONS = {
  home: '<path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10M9 20v-6h6v6"/>',
  dumbbell: '<path d="M6 7v10M3.5 9v6M18 7v10M20.5 9v6M6 12h12"/>',
  chart: '<path d="M4 19V5M4 19h17"/><path d="m7 15 4-4 3 2 5-7"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/>',
  moon: '<path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"/>',
  arrow: '<path d="m15 18-6-6 6-6"/>',
  chevron: '<path d="m9 18 6-6-6-6"/>',
  up: '<path d="m6 15 6-6 6 6"/>',
  down: '<path d="m6 9 6 6 6-6"/>',
  play: '<path d="m9 7 8 5-8 5Z"/>',
  settings: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-1.6-1H3v-4h.1A1.7 1.7 0 0 0 4.6 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-1.6V3h4v.1A1.7 1.7 0 0 0 15 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9a1.7 1.7 0 0 0 1.6 1h.1v4H21a1.7 1.7 0 0 0-1.6 1Z"/>',
  check: '<path d="m5 12 4 4L19 6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  minus: '<path d="M5 12h14"/>',
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  flame: '<path d="M12 22c4 0 7-3 7-7 0-3-1.5-5.5-4-8 .2 2-1 3.5-2 4-1-3-3-6-5-8 .3 4-3 6-3 11 0 4.5 3 8 7 8Z"/>',
  calendar: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/>',
  trash: '<path d="M4 7h16M9 7V4h6v3M7 7l1 14h8l1-14M10 11v6M14 11v6"/>',
  download: '<path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/>',
  upload: '<path d="M12 21V9M7 14l5-5 5 5"/><path d="M5 3h14"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
  lock: '<rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/>'
};
const ic = (n, s = 24) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n]}</svg>`;

/* ---------- dados ---------- */
const KEY = 'treino-app-v1', SYNC_KEY = 'treino-app-sync-v1', TEMA_KEY = 'treino-app-tema';
let S = carregar();
let sync = (() => { try { return JSON.parse(lsGet(SYNC_KEY)) || {}; } catch (e) { return {}; } })();
let syncMsg = '', syncErro = false, pushTimer = null;
let rascunho = null;          // exercício novo, ainda não salvo
let editandoMeta = false;

function semente() {
  const ex = (nome, series, reps, descanso, passo) => ({ id: uid(), nome, video: '', series, reps, descanso, regulagem: '', passo, carga: 0 });
  return { v: 1,
    plan: { updatedAt: Date.now(), meta: 12, treinos: [
      { id: uid(), nome: 'Inferiores', frente: 'Musculação', dias: [1, 4], exercicios: [ex('Leg press', 3, 12, 90, 5), ex('Cadeira extensora', 3, 12, 60, 2.5), ex('Mesa flexora', 3, 12, 60, 2.5)] },
      { id: uid(), nome: 'Superiores', frente: 'Musculação', dias: [2, 5], exercicios: [ex('Puxada frontal', 3, 10, 90, 2.5), ex('Remada baixa', 3, 10, 90, 2.5), ex('Supino na máquina', 3, 10, 90, 2.5)] },
      { id: uid(), nome: 'Ballet', frente: 'Ballet', dias: [1, 2, 3, 4, 5], exercicios: [ex('Aquecimento dos pés', 2, 15, 30, 0), ex('Alongamento de posterior', 2, 30, 20, 0)] }
    ] },
    logs: [], aulas: [], conclusoes: [] };
}
function carregar() {
  try {
    const r = JSON.parse(lsGet(KEY));
    if (r && r.plan && Array.isArray(r.plan.treinos)) {
      r.logs = r.logs || []; r.aulas = r.aulas || []; r.conclusoes = r.conclusoes || [];
      r.plan.meta = r.plan.meta > 0 ? r.plan.meta : 12;
      return r;
    }
  } catch (e) {}
  return semente();
}
function salvar(semPush) { lsSet(KEY, JSON.stringify(S)); if (!semPush) agendarPush(); }
function tocarPlano() { S.plan.updatedAt = Date.now(); }
const treinoPorId = id => S.plan.treinos.find(t => t.id === id);
function acharEx(id) { for (const t of S.plan.treinos) { const e = t.exercicios.find(x => x.id === id); if (e) return { t, e }; } return null; }
const logsDe = (exId, data) => S.logs.filter(l => !l.del && l.exId === exId && (!data || l.data === data));
const feitasHoje = e => new Set(logsDe(e.id, hoje()).map(l => l.serie)).size;
const concluidoHoje = t => S.conclusoes.find(c => !c.del && c.tid === t.id && c.data === hoje());
const letra = t => String.fromCharCode(65 + Math.max(0, S.plan.treinos.indexOf(t)));
const tituloTreino = t => t.frente === 'Ballet' ? t.nome : `Treino ${letra(t)} · ${t.nome}`;
const diasTxt = (t, sep = ', ') => ORDEM_DIAS.filter(i => t.dias.includes(i)).map(i => DIAS[i]).join(sep);
const plural = (n, um, varios) => `${n} ${n === 1 ? um : varios}`;

function sessoes(exId) {
  const m = {};
  for (const l of logsDe(exId)) (m[l.data] = m[l.data] || []).push(l);
  return Object.keys(m).sort().reverse().map(d => ({ data: d, sets: m[d].sort((a, b) => a.serie - b.serie) }));
}
function sugestao(e) {
  const ss = sessoes(e.id).filter(s => s.data !== hoje());
  if (!ss.length) return { titulo: 'Escolha uma carga inicial', detalhe: 'Primeira vez neste exercício: comece com uma carga confortável.', peso: null, ultima: null };
  const s = ss[0], maxPeso = Math.max(...s.sets.map(x => x.peso));
  const completo = s.sets.length >= e.series && s.sets.every(x => x.reps >= e.reps);
  const quando = fmtBarra(s.data);
  if (completo && e.passo > 0) return { titulo: `Tente ${fmt(maxPeso + e.passo)} kg hoje`, detalhe: `Você fechou ${e.series} × ${e.reps} com ${fmt(maxPeso)} kg na última vez (${quando}).`, peso: maxPeso + e.passo, ultima: s };
  return { titulo: `Mantenha ${fmt(maxPeso)} kg`, detalhe: `Última vez (${quando}): ${s.sets.map(x => `${fmt(x.peso)} kg × ${x.reps}`).join(', ')}. Feche ${e.series} × ${e.reps} para subir.`, peso: maxPeso, ultima: s };
}
function treinosDoMes() {
  const d = new Date(), pre = `${d.getFullYear()}-${pad(d.getMonth() + 1)}-`, dias = new Set();
  for (const l of S.logs) if (!l.del && l.data.startsWith(pre)) dias.add(l.data);
  for (const a of S.aulas) if (a.data.startsWith(pre)) dias.add(a.data);
  for (const c of S.conclusoes) if (!c.del && c.data.startsWith(pre)) dias.add(c.data);
  return dias.size;
}

/* ---------- tema (automático, claro ou escuro) ---------- */
const raiz = document.documentElement;
const temaDoHospedeiro = raiz.getAttribute('data-theme');
let temaPref = ['auto', 'light', 'dark'].includes(lsGet(TEMA_KEY)) ? lsGet(TEMA_KEY) : 'auto';
const escuroAgora = () => { const a = raiz.getAttribute('data-theme'); return a === 'dark' || (a !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches); };
function aplicarTema() {
  if (temaPref === 'auto') { if (temaDoHospedeiro) raiz.setAttribute('data-theme', temaDoHospedeiro); else raiz.removeAttribute('data-theme'); }
  else raiz.setAttribute('data-theme', temaPref);
  const tc = $('#tc'); if (tc) tc.content = escuroAgora() ? '#090e1e' : '#f4f5f8';
}
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', aplicarTema); } catch (e) {}

/* ---------- roteamento ---------- */
const rota = () => { const p = location.hash.split('/'); return { nome: p[1] || 'hoje', a: p[2], b: p[3] }; };
const ABA = { hoje: 'hoje', treino: 'treinos', exercicio: 'treinos', treinos: 'treinos', editar: 'treinos', 'ex-editar': 'treinos', evolucao: 'evolucao', ajustes: 'ajustes' };
let navCount = 0;
function render(manter) {
  const r = rota();
  const views = { hoje: vHoje, treino: vTreino, exercicio: vExercicio, treinos: vTreinos, editar: vEditar, 'ex-editar': vExEditar, evolucao: vEvolucao, ajustes: vAjustes };
  const aba = ABA[r.nome] || 'hoje';
  $$('.bottom-nav a').forEach(a => a.dataset.tab === aba ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
  $('#app').innerHTML = (views[r.nome] || vHoje)(r);
  ajustarTextareas();
  if (!manter) window.scrollTo(0, 0);
}
function renderManter() { const y = window.scrollY; render(true); window.scrollTo(0, y); }
window.addEventListener('hashchange', () => { navCount++; if (rota().nome !== 'exercicio') esconderDescanso(); render(); });
function paiDe(r) {
  if (r.nome === 'exercicio') { const f = acharEx(r.a); return f ? 'treino/' + f.t.id : 'treinos'; }
  if (r.nome === 'ex-editar') return 'editar/' + r.a;
  if (r.nome === 'treino' || r.nome === 'editar') return 'treinos';
  return 'hoje';
}
function voltar() { if (navCount > 0) history.back(); else location.replace('#/' + paiDe(rota())); }
function ajustarTextareas() { $$('#app textarea.auto').forEach(t => { t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px'; }); }
function ajustarLargura(inp) { inp.style.width = (Math.max(2, inp.value.length) + .5) + 'ch'; }

/* ---------- peças de tela ---------- */
function cabecalho({ eyebrow, titulo, voltarBtn, direita }) {
  return `<header class="page-header"><div class="header-top">${voltarBtn ? `<button type="button" class="back-button" data-act="voltar">${ic('arrow', 20)} Voltar</button>` : `<span class="eyebrow">${esc(eyebrow || '')}</span>`}${direita || ''}</div><h1>${esc(titulo)}</h1></header>`;
}
function contador({ valor, unit = '', campo, step = 1, rot }) {
  const v = fmt(valor);
  return `<div class="counter"><button type="button" data-act="step" data-d="-1" data-step="${step}" aria-label="Diminuir">${ic('minus')}</button><strong><input class="cnt-input" data-campo="${campo}" inputmode="decimal" autocomplete="off" value="${v}" style="width:${Math.max(2, v.length) + .5}ch" aria-label="${esc(rot)}">${unit ? `<small>${unit}</small>` : ''}</strong><button type="button" data-act="step" data-d="1" data-step="${step}" aria-label="Aumentar">${ic('plus')}</button></div>`;
}
const envolver = (t, html) => `<div class="${t && t.frente === 'Ballet' ? 'is-ballet' : ''}">${html}</div>`;
const naoEncontrado = txt => cabecalho({ titulo: txt + ' não encontrado', voltarBtn: true }) + `<div class="vazio"><p>Esse item não existe mais neste aparelho.</p><a class="primary-button" href="#/hoje">Ir para Hoje</a></div>`;

/* ---------- Hoje ---------- */
function metaCard() {
  const feitos = treinosDoMes(), meta = S.plan.meta, pct = Math.min(100, Math.round(feitos / meta * 100)), falta = Math.max(0, meta - feitos);
  const titulo = falta === 0 ? 'Meta concluída!' : falta === 1 ? 'Falta 1 treino' : `Faltam ${falta} treinos`;
  return `<section class="monthly-goal"><div class="monthly-goal-card">
    <div class="goal-ring" style="--goal-progress:${pct * 3.6}deg" role="img" aria-label="${feitos} de ${meta} treinos no mês"><div><strong>${feitos}</strong><span>de ${meta}</span></div></div>
    <div class="goal-copy"><span>META DE ${MESES[new Date().getMonth()]}</span><strong>${titulo}</strong><p>${pct}% da meta mensal</p></div>
    <button type="button" class="goal-edit-button" data-act="editar-meta" aria-label="${editandoMeta ? 'Concluir edição' : 'Editar meta'}">${ic(editandoMeta ? 'check' : 'settings', 20)}</button></div>
    ${editandoMeta ? `<div class="goal-editor"><div><label>META DO MÊS (TREINOS)</label>${contador({ valor: meta, campo: 'meta', step: 1, rot: 'Meta do mês' })}</div><p>Os treinos feitos são contados sozinhos: cada dia com série ou aula registrada vale 1.</p></div>` : ''}
  </section>`;
}
function cartaoPlano(t) {
  const total = t.exercicios.reduce((s, e) => s + e.series, 0);
  const feitas = t.exercicios.reduce((s, e) => s + Math.min(feitasHoje(e), e.series), 0);
  const conc = !!concluidoHoje(t), ball = t.frente === 'Ballet';
  const pct = conc ? 100 : (total ? Math.round(feitas / total * 100) : 0);
  const estado = conc || (total && feitas >= total) ? 'Concluído' : feitas > 0 ? 'Em andamento' : 'Começar';
  return `<a class="plan-card ${ball ? 'ballet' : 'strength'}" href="#/treino/${t.id}"><span class="plan-type">${esc(t.frente.toUpperCase())}</span><strong>${esc(tituloTreino(t))}</strong><p>${plural(t.exercicios.length, 'exercício', 'exercícios')} · ${feitas} de ${plural(total, 'série', 'séries')}</p><div class="hero-progress"><span style="width:${pct}%"></span></div><div class="hero-footer"><b>${estado}</b>${ic('chevron')}</div></a>`;
}
function aulaCard() {
  const a = S.aulas.find(x => x.data === hoje());
  return `<section class="class-log"><div class="section-heading compact"><div><span class="kicker" style="color:var(--ballet)">BALLET</span><h2>${a ? 'Aula de hoje registrada' : 'Registrar aula de hoje'}</h2></div></div>
    <label>Duração (minutos)</label>${contador({ valor: a ? a.duracao : 60, campo: 'duracao', step: 5, rot: 'Duração da aula em minutos' })}
    <label>Como foi</label>
    <div class="feeling-picker" id="sentir">${SENTIR.map((s, i) => `<button type="button" data-act="sentir" data-v="${i + 1}" class="${a && a.sentir === i + 1 ? 'selected' : ''}" aria-pressed="${!!(a && a.sentir === i + 1)}">${s}</button>`).join('')}</div>
    <textarea id="aula-nota" aria-label="Observações da aula" placeholder="Anotações da aula (opcional)">${esc(a ? a.nota : '')}</textarea>
    <button type="button" class="primary-button ballet-button" data-act="salvar-aula">${a ? 'Atualizar aula' : 'Registrar aula'}</button></section>`;
}
function vHoje() {
  const d = new Date(), lista = S.plan.treinos.filter(t => t.dias.includes(d.getDay()));
  const data = d.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' }).toUpperCase();
  let h = cabecalho({ eyebrow: data, titulo: 'Hoje' }) + metaCard();
  if (!lista.length) h += `<div class="vazio"><strong>Nenhum treino marcado para hoje.</strong><p>Marque os dias de cada treino ao editá-lo, ou abra um treino na aba Treinos.</p><a class="primary-button" href="#/treinos">${ic('dumbbell')} Ver treinos</a></div>`;
  else h += `<section class="today-plans">${lista.map(cartaoPlano).join('')}</section>`;
  if (lista.some(t => t.frente === 'Ballet')) h += aulaCard();
  return h;
}

/* ---------- Treinos ---------- */
function vTreinos() {
  const dia = new Date().getDay();
  let h = cabecalho({ eyebrow: 'SEUS PLANOS', titulo: 'Treinos' }) + '<p class="page-intro">Musculação e ballet</p>';
  if (!S.plan.treinos.length) h += '<div class="vazio"><p>Nenhum treino ainda. Crie o primeiro.</p></div>';
  else h += `<div class="workout-list">${S.plan.treinos.map(t => `<article class="workout-card ${t.frente === 'Ballet' ? 'ballet' : ''} ${t.dias.includes(dia) ? 'featured' : ''}"><a class="workout-main" href="#/treino/${t.id}"><span class="workout-letter">${letra(t)}</span><span class="workout-copy"><small>${esc(diasTxt(t, ' · ') || 'sem dias')}</small><strong>${esc(t.nome)}</strong><span>${plural(t.exercicios.length, 'exercício', 'exercícios')} · ${esc(t.frente)}</span></span></a><a class="workout-edit-button" href="#/editar/${t.id}" aria-label="Editar ${esc(t.nome)}">${ic('settings', 19)}</a>${ic('chevron')}</article>`).join('')}</div>`;
  return h + `<button type="button" class="primary-button" data-act="novo-treino">${ic('plus')} Novo treino</button>`;
}

/* ---------- Treino do dia ---------- */
function vTreino(r) {
  const t = treinoPorId(r.a);
  if (!t) return naoEncontrado('Treino');
  const ball = t.frente === 'Ballet';
  let h = cabecalho({ titulo: ball ? t.nome : `Treino ${letra(t)}`, voltarBtn: true, direita: `<a class="round-button" href="#/editar/${t.id}" aria-label="Editar treino">${ic('settings', 21)}</a>` });
  h += `<div class="title-meta"><span>${esc(t.frente.toUpperCase())}</span><p>${ball ? '' : esc(t.nome) + ' · '}${esc(diasTxt(t) || 'sem dias marcados')}</p></div>`;
  if (!t.exercicios.length) h += `<div class="vazio"><p>Este treino ainda não tem exercícios.</p><a class="primary-button" href="#/editar/${t.id}">${ic('plus')} Adicionar exercícios</a></div>`;
  else {
    h += `<section><div class="section-heading compact"><h2>Exercícios</h2><span>${t.exercicios.length} no total</span></div><div class="exercise-rows">`;
    t.exercicios.forEach((e, i) => {
      const feito = feitasHoje(e) >= e.series;
      h += `<a class="exercise-row" href="#/exercicio/${e.id}"><span class="order ${feito ? 'completed' : ''}">${feito ? ic('check', 19) : i + 1}</span><span class="exercise-copy"><strong>${esc(e.nome)}</strong><small>${plural(e.series, 'série', 'séries')} · ${e.reps} reps · ${e.descanso}s descanso</small></span>${ic('chevron')}</a>`;
    });
    h += '</div></section>';
  }
  if (t.exercicios.length) h += concluidoHoje(t)
    ? `<div class="done-banner"><span>${ic('check', 20)} Treino concluído hoje</span><button type="button" data-act="desfazer-conclusao" data-tid="${t.id}">Desfazer</button></div>`
    : `<button type="button" class="primary-button bottom-action" data-act="concluir-treino" data-tid="${t.id}">${ic('check')} Concluir treino</button>`;
  if (ball) h += aulaCard();
  return envolver(t, h);
}

/* ---------- Exercício ---------- */
function vExercicio(r) {
  const f = acharEx(r.a);
  if (!f) return naoEncontrado('Exercício');
  const { t, e } = f, comPeso = t.frente !== 'Ballet', video = safeUrl(e.video);
  const sug = comPeso ? sugestao(e) : null;
  const cargaBase = comPeso ? (e.carga > 0 ? e.carga : (sug.peso != null ? sug.peso : 0)) : 0;
  const passo = e.passo > 0 ? e.passo : 2.5;
  const hojeLogs = logsDe(e.id, hoje()), nFeitas = new Set(hojeLogs.map(l => l.serie)).size;
  let h = cabecalho({ titulo: e.nome, voltarBtn: true, direita: comPeso ? `<a class="round-button" href="#/evolucao/${e.id}" aria-label="Ver evolução">${ic('chart', 21)}</a>` : '' });
  h += `<div class="exercise-tags"><span>${plural(e.series, 'SÉRIE', 'SÉRIES')}</span><span>${e.reps} REPS</span><span>DESCANSO ${e.descanso} S</span></div>`;
  h += video ? `<a class="video-button" href="${esc(video)}" target="_blank" rel="noopener">${ic('play', 20)} Ver vídeo de explicação</a>` : `<a class="video-button" href="#/ex-editar/${t.id}/${e.id}">${ic('play', 20)} Adicionar link do vídeo</a>`;
  h += `<section class="machine-card"><span class="machine-icon">${ic('settings', 22)}</span><div><small>REGULAGEM DO APARELHO</small><textarea id="regul" class="auto" rows="1" data-bind="regulagem" data-eid="${e.id}" aria-label="Regulagem do aparelho" placeholder="Toque para anotar: banco, apoio, pegada…">${esc(e.regulagem)}</textarea></div></section>`;
  if (comPeso) {
    h += `<section class="suggestion-card"><span class="kicker">SUGESTÃO DE CARGA</span><strong>${esc(sug.titulo)}</strong><p>${esc(sug.detalhe)}</p></section>`;
    h += `<section class="current-load" data-eid="${e.id}"><div class="section-heading compact"><h2>Carga de hoje</h2><span>passo de ${fmt(passo)} kg</span></div>${contador({ valor: cargaBase, unit: 'kg', campo: 'carga', step: passo, rot: 'Carga de hoje em quilos' })}${sug.peso != null ? `<button type="button" data-act="usar-sugestao" data-peso="${sug.peso}">Usar sugestão (${fmt(sug.peso)} kg)</button>` : ''}</section>`;
  }
  h += `<section class="sets-section"><div class="section-heading compact"><h2>Séries de hoje</h2><span class="sets-count">${nFeitas}/${e.series} feitas</span></div>`;
  for (let i = 1; i <= e.series; i++) {
    const feito = hojeLogs.find(l => l.serie === i);
    const peso = feito ? feito.peso : cargaBase, reps = feito ? feito.reps : e.reps;
    h += `<article class="set-card ${feito ? 'set-done' : ''}" data-serie="${i}" data-eid="${e.id}"><div class="set-title"><span>SÉRIE ${i}</span>${feito ? `<b>${ic('check', 16)} FEITA</b>` : ''}</div>
      <div class="set-counters">${comPeso ? `<div><label>CARGA (KG)</label>${contador({ valor: peso, campo: 'peso', step: passo, rot: 'Carga da série ' + i })}</div>` : ''}<div ${comPeso ? '' : 'style="grid-column:1/-1"'}><label>REPETIÇÕES</label>${contador({ valor: reps, campo: 'reps', step: 1, rot: 'Repetições da série ' + i })}</div></div>
      <button type="button" class="complete-button ${feito ? 'is-done' : ''}" data-act="alternar-serie">${ic('check')} ${feito ? 'Série concluída' : 'Concluir série'}</button></article>`;
  }
  return envolver(t, h + '</section>');
}

/* ---------- Evolução ---------- */
function graficoLinha(pts) {
  const X0 = 46, X1 = 326, Y0 = 30, Y1 = 148, YB = 165;
  const ts = pts.map(p => new Date(p.d + 'T00:00:00').getTime()), t0 = Math.min(...ts), t1 = Math.max(...ts);
  let lo = Math.min(...pts.map(p => p.v)), hi = Math.max(...pts.map(p => p.v));
  if (hi === lo) { lo = Math.max(0, lo - 2.5); hi += 2.5; } else { const m = (hi - lo) * .12; lo = Math.max(0, lo - m); hi += m; }
  const x = t => t1 === t0 ? (X0 + X1) / 2 : X0 + (t - t0) / (t1 - t0) * (X1 - X0);
  const y = v => Y0 + (1 - (v - lo) / (hi - lo)) * (Y1 - Y0);
  const rot = v => fmt(Math.round(v * 2) / 2);
  const P = pts.map((p, i) => [x(ts[i]), y(p.v)]);
  const linha = P.map(([a, b], i) => `${i ? 'L' : 'M'}${a.toFixed(1)} ${b.toFixed(1)}`).join(' ');
  const mid = (Y0 + Y1) / 2;
  const grade = [[Y0, hi], [mid, (hi + lo) / 2], [Y1, lo]].map(([gy, v]) => `<line x1="${X0}" y1="${gy}" x2="${X1}" y2="${gy}"/>`).join('');
  const rotulos = [[Y0, hi], [mid, (hi + lo) / 2], [Y1, lo]].map(([gy, v]) => `<text x="${X0 - 8}" y="${gy + 3}" text-anchor="end">${rot(v)}</text>`).join('');
  const datas = pts.length > 1
    ? `<text x="${X0}" y="184">${fmtEixo(pts[0].d)}</text><text x="${X1}" y="184" text-anchor="end">${fmtEixo(pts[pts.length - 1].d)}</text>`
    : `<text x="${(X0 + X1) / 2}" y="184" text-anchor="middle">${fmtEixo(pts[0].d)}</text>`;
  return `<svg class="line-chart" viewBox="0 0 340 190" role="img" aria-label="Carga máxima por dia: de ${fmt(pts[0].v)} para ${fmt(pts[pts.length - 1].v)} quilos">
    <defs><linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--accent);stop-opacity:.3"/><stop offset="1" style="stop-color:var(--accent);stop-opacity:0"/></linearGradient></defs>
    <g class="grid">${grade}</g>
    ${pts.length > 1 ? `<path class="area" d="${linha} L${P[P.length - 1][0].toFixed(1)} ${YB} L${P[0][0].toFixed(1)} ${YB}Z"/><path class="chart-line" d="${linha}"/>` : ''}
    ${P.map(([a, b], i) => `<circle cx="${a.toFixed(1)}" cy="${b.toFixed(1)}" r="5"><title>${fmtBarra(pts[i].d)}: ${fmt(pts[i].v)} kg</title></circle>`).join('')}
    <g class="axis-label">${rotulos}${datas}</g></svg>`;
}
function vEvolucao(r) {
  const todos = [];
  for (const t of S.plan.treinos) if (t.frente !== 'Ballet') for (const e of t.exercicios) if (logsDe(e.id).length) todos.push({ t, e });
  const aulas = S.aulas.filter(a => (Date.now() - new Date(a.data + 'T00:00:00')) / 864e5 <= 30);
  let h = cabecalho({ eyebrow: 'SEU DESEMPENHO', titulo: 'Evolução' }) + '<p class="page-intro">Carga máxima por dia de treino</p>';
  if (!todos.length) h += '<div class="vazio"><strong>Ainda sem registros.</strong><p>Conclua séries na tela de um exercício e o gráfico aparece aqui.</p></div>';
  else {
    const sel = todos.find(x => x.e.id === r.a) || todos[0];
    const ss = sessoes(sel.e.id), pts = ss.slice().reverse().map(s => ({ d: s.data, v: Math.max(...s.sets.map(x => x.peso)) }));
    h += `<section class="chart-card"><div class="chart-title"><span class="chart-name">${esc(sel.e.nome)} (${esc(tituloTreino(sel.t))})</span><span class="chart-pick">${ic('chevron', 18)}</span><select class="chart-select" data-bind="evo-ex" aria-label="Escolher exercício">${todos.map(x => `<option value="${x.e.id}" ${x.e.id === sel.e.id ? 'selected' : ''}>${esc(x.e.nome)} (${esc(tituloTreino(x.t))})</option>`).join('')}</select></div>${graficoLinha(pts)}</section>`;
    h += `<section class="history-section"><div class="section-heading compact"><h2>Histórico</h2><span>${plural(ss.length, 'sessão', 'sessões')}</span></div><div class="history-list">`;
    ss.slice(0, 12).forEach((s, i) => {
      const pesos = s.sets.map(x => x.peso), varia = new Set(pesos).size > 1;
      h += `<article><span class="history-mark ${i === 0 ? 'latest' : ''}"></span><div><small>${fmtData(s.data)}${varia ? ' · ' + pesos.map(fmt).join(' / ') + ' kg' : ''}</small><strong>${fmt(Math.max(...pesos))} kg</strong></div><p>${s.sets.map(x => x.reps).join(' · ')}<small>REPS</small></p></article>`;
    });
    h += '</div></section>';
  }
  const media = aulas.length ? Math.round(aulas.reduce((s, a) => s + a.duracao, 0) / aulas.length) : 0;
  h += `<section class="ballet-summary"><div class="section-heading compact"><h2>Ballet nos últimos 30 dias</h2></div><p>${aulas.length ? `<strong>${plural(aulas.length, 'aula', 'aulas')}</strong> ${aulas.length === 1 ? 'registrada' : 'registradas'}, duração média de <strong>${media} min.</strong>` : 'Nenhuma aula registrada nos últimos 30 dias.'}</p></section>`;
  return h;
}

/* ---------- Editar treino e exercício ---------- */
function vEditar(r) {
  const t = treinoPorId(r.a);
  if (!t) return naoEncontrado('Treino');
  let h = cabecalho({ titulo: 'Editar treino', voltarBtn: true });
  h += `<section class="form-section"><label for="t-nome">Nome do treino</label><input id="t-nome" data-bind="t-nome" data-tid="${t.id}" value="${esc(t.nome)}" placeholder="Ex.: Superiores" autocomplete="off">
    <label for="t-frente">Frente</label><select id="t-frente" data-bind="t-frente" data-tid="${t.id}"><option ${t.frente === 'Musculação' ? 'selected' : ''}>Musculação</option><option ${t.frente === 'Ballet' ? 'selected' : ''}>Ballet</option></select>
    <label id="lb-dias">Dias da semana</label><div class="day-picker" role="group" aria-labelledby="lb-dias">${ORDEM_DIAS.map(i => `<button type="button" data-act="toggle-dia" data-tid="${t.id}" data-i="${i}" class="${t.dias.includes(i) ? 'selected' : ''}" aria-pressed="${t.dias.includes(i)}">${DIAS[i]}</button>`).join('')}</div></section>`;
  h += `<section class="edit-exercises"><div class="section-heading compact"><div><h2>Exercícios</h2>${t.exercicios.length ? '<p class="edit-help">Toque num exercício para editar. Use as setas para mudar a ordem.</p>' : ''}</div><span>${plural(t.exercicios.length, 'item', 'itens')}</span></div>`;
  if (t.exercicios.length) h += `<div class="reorder-list">${t.exercicios.map((e, i) => `<article><span class="order">${i + 1}</span><a class="reorder-text" href="#/ex-editar/${t.id}/${e.id}"><strong>${esc(e.nome)}</strong><small>${plural(e.series, 'série', 'séries')} · ${e.reps} reps · ${e.descanso}s</small></a><button type="button" data-act="mover" data-tid="${t.id}" data-eid="${e.id}" data-dir="-1" aria-label="Subir ${esc(e.nome)}" ${i === 0 ? 'disabled' : ''}>${ic('up', 20)}</button><button type="button" data-act="mover" data-tid="${t.id}" data-eid="${e.id}" data-dir="1" aria-label="Descer ${esc(e.nome)}" ${i === t.exercicios.length - 1 ? 'disabled' : ''}>${ic('down', 20)}</button></article>`).join('')}</div>`;
  h += `<button type="button" class="add-exercise" data-act="novo-ex" data-tid="${t.id}">${ic('plus')} Adicionar exercício</button></section>
    <div class="danger-zone"><button type="button" data-act="pedir-excluir" data-alvo="treino" data-tid="${t.id}">${ic('trash', 20)} Excluir treino</button></div>
    <button type="button" class="primary-button bottom-action" data-act="salvar-treino" data-tid="${t.id}">${ic('check')} Salvar alterações</button>`;
  return envolver(t, h);
}
function vExEditar(r) {
  const t = treinoPorId(r.a), novo = r.b === 'novo';
  const e = t && (novo ? (rascunho && rascunho.tid === t.id ? rascunho.e : null) : t.exercicios.find(x => x.id === r.b));
  if (!e) return naoEncontrado('Exercício');
  const comPeso = t.frente !== 'Ballet', eid = novo ? 'novo' : e.id;
  let h = cabecalho({ titulo: novo ? 'Novo exercício' : e.nome, voltarBtn: true });

/* ---------- descanso entre séries ---------- */
let restFim = 0, restTotal = 0, restId = null, audioCtx = null;
let beepEl = null, wake = null;
function wavBeep() {
  const sr = 22050, n = Math.floor(sr * 1.4), buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, t) => { for (let i = 0; i < t.length; i++) v.setUint8(o + i, t.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
  v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) {
    const t = i / sr, k = t % 0.45, on = k < 0.25 && t < 1.35, env = on ? Math.min(1, k * 40, (0.25 - k) * 40) : 0;
    v.setInt16(44 + i * 2, Math.sin(2 * Math.PI * 880 * t) * env * 0.7 * 32767, true);
  }
  let bin = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i++) bin += String.fromCharCode(u[i]);
  return 'data:audio/wav;base64,' + btoa(bin);
}
/* Chamado num toque do usuário: deixa o som liberado e tocando mesmo no modo silencioso do iPhone. */
function prepararSom() {
  try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
  try {
    if (!beepEl) { beepEl = new Audio(wavBeep()); beepEl.preload = 'auto'; }
    beepEl.muted = true;
    const p = beepEl.play();
    if (p && p.then) p.then(() => { beepEl.pause(); beepEl.currentTime = 0; beepEl.muted = false; }).catch(() => { beepEl.muted = false; });
  } catch (e) {}
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch (e) {}
}
function bipCtx() {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.connect(g); g.connect(audioCtx.destination); o.frequency.value = 880; g.gain.value = .15;
    o.start(); o.stop(audioCtx.currentTime + .25);
  } catch (e) {}
}
function bip() {
  try { beepEl.muted = false; beepEl.currentTime = 0; const p = beepEl.play(); if (p && p.catch) p.catch(bipCtx); } catch (e) { bipCtx(); }
}
async function manterTela() { try { if (navigator.wakeLock && !wake) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => { wake = null; }); } } catch (e) {} }
function soltarTela() { try { wake && wake.release(); } catch (e) {} wake = null; }
function iniciarDescanso(seg) {
  if (!seg || seg < 1) return;
  prepararSom(); manterTela();
  restTotal = seg; restFim = Date.now() + seg * 1000;
  $('#rest').hidden = false; document.body.classList.add('timer-on'); $('#rest-txt').textContent = 'DESCANSO';
  clearInterval(restId); restId = setInterval(tickDescanso, 250); tickDescanso();
}
function esconderDescanso() { soltarTela(); clearInterval(restId); restId = null; $('#rest').hidden = true; document.body.classList.remove('timer-on'); }
function tickDescanso() {
  const falta = Math.ceil((restFim - Date.now()) / 1000);
  if (falta <= 0) {
    clearInterval(restId); restId = null; soltarTela();
    $('#rest-time').textContent = '0:00'; $('#rest-txt').textContent = 'DESCANSO CONCLUÍDO'; $('#rest-ring').style.setProperty('--progress', '0deg');
    bip(); try { navigator.vibrate && navigator.vibrate(200); } catch (e) {}
    const marca = restFim; setTimeout(() => { if (restId === null && restFim === marca) esconderDescanso(); }, 6000);
    return;
  }
  $('#rest-time').textContent = `${Math.floor(falta / 60)}:${pad(falta % 60)}`;
  $('#rest-ring').style.setProperty('--progress', `${(falta / restTotal) * 360}deg`);
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.id); toast.id = setTimeout(() => t.classList.remove('on'), 1800); }

/* ---------- séries, carga e meta ---------- */
function gravarSerie(row) {
  const f = acharEx(row.dataset.eid); if (!f) return null;
  const serie = parseInt(row.dataset.serie, 10), pInp = $('[data-campo=peso]', row);
  const peso = pInp ? num(pInp.value) : 0, reps = Math.round(num($('[data-campo=reps]', row).value));
  const l = S.logs.find(x => x.exId === f.e.id && x.data === hoje() && x.serie === serie);
  if (l) { l.peso = peso; l.reps = reps; l.del = false; l.t = Date.now(); }
  else S.logs.push({ id: uid(), exId: f.e.id, data: hoje(), serie, peso, reps, t: Date.now() });
  if (pInp) {
    const mx = Math.max(...logsDe(f.e.id, hoje()).map(x => x.peso));
    if (f.e.carga !== mx) { f.e.carga = mx; tocarPlano(); }
    const ci = $('[data-campo=carga]'); if (ci) { ci.value = fmt(mx); ajustarLargura(ci); }

}
function marcarSerie(row, feito) {

  if (feito && !b) tit.insertAdjacentHTML('beforeend', `<b>${ic('check', 16)} FEITA</b>`);
  if (!feito && b) b.remove();
  const btn = $('.complete-button', row); btn.classList.toggle('is-done', feito); btn.innerHTML = `${ic('check')} ${feito ? 'Série concluída' : 'Concluir série'}`;

}
function aplicarCarga(inp) {
  const box = inp.closest('.current-load'), f = box && acharEx(box.dataset.eid); if (!f) return;
  f.e.carga = Math.max(0, num(inp.value)); tocarPlano(); salvar();
  $$('.set-card:not(.set-done) [data-campo=peso]').forEach(i => { i.value = fmt(f.e.carga); ajustarLargura(i); });

function aplicarMeta(inp) {

function aoMudarCampo(inp) {

  else if (c === 'peso' || c === 'reps') { const row = inp.closest('.set-card'); if (row && row.classList.contains('set-done')) gravarSerie(row); }
}

    } catch (e) { setSync(e.message === 'Failed to fetch' ? 'Sem conexão. Confira a URL do projeto e a internet.' : (e.message || 'Falha ao entrar.'), true); }
  },
  sair() { sync = { url: sync.url, key: sync.key, email: sync.email }; lsSet(SYNC_KEY, JSON.stringify(sync)); syncMsg = 'Você saiu. Os dados continuam neste aparelho.'; syncErro = false; render(true); },
  'concluir-treino'(b) {
    const t = treinoPorId(b.dataset.tid); if (!t) return;
    const c = S.conclusoes.find(x => x.tid === t.id && x.data === hoje());
    if (c) { c.del = false; c.t = Date.now(); } else S.conclusoes.push({ id: uid(), tid: t.id, data: hoje(), t: Date.now() });
    salvar(); esconderDescanso(); toast('Treino concluído!'); location.replace('#/hoje');
  },
  'desfazer-conclusao'(b) {
    const c = S.conclusoes.find(x => !x.del && x.tid === b.dataset.tid && x.data === hoje());
    if (c) { c.del = true; c.t = Date.now(); salvar(); }
    renderManter();
  },
  async 'trocar-senha'() {
    const n1 = $('#n-pass').value, n2 = $('#n-pass2').value;
    const st = (msg, tipo) => { const el = $('#senha-status'); el.hidden = false; el.className = 'connection-status ' + (tipo || ''); $('.txt', el).textContent = msg; };
    if (n1.length < 6) return st('A senha precisa ter pelo menos 6 caracteres.', 'erro');
    if (n1 !== n2) return st('As duas senhas não são iguais.', 'erro');
    st('Trocando…');
    try {
      await garantirSessao();
      const r = await fetch(`${sync.url}/auth/v1/user`, { method: 'PUT', headers: cab(), body: JSON.stringify({ password: n1 }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok) {
        const cod = j.error_code || j.code || '';
        if (cod === 'same_password') throw new Error('A nova senha precisa ser diferente da atual.');
        if (cod === 'weak_password') throw new Error('Senha fraca demais. Use mais caracteres, misturando letras e números.');
        if (cod === 'reauthentication_needed') throw new Error('Por segurança, toque em Entrar de novo (com a senha atual) e tente outra vez.');
        throw new Error(j.msg || j.message || j.error_description || 'Não foi possível trocar a senha.');
      }
      $('#n-pass').value = ''; $('#n-pass2').value = '';
      st('Senha trocada. Use a nova senha ao entrar nos outros aparelhos.', 'connected');
    } catch (e) { st(e.message === 'Failed to fetch' ? 'Sem conexão. Tente de novo.' : e.message, 'erro'); }
  },
  'sync-agora'() { sincronizar(); }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (b && acoes[b.dataset.act]) acoes[b.dataset.act](b, e); });
document.addEventListener('change', e => {
  const el = e.target, k = el.dataset && el.dataset.bind;
  if (el.id === 'imp') { importar(el.files[0]); el.value = ''; return; }
  if (el.classList.contains('cnt-input')) { el.value = fmt(Math.max(0, num(el.value))); ajustarLargura(el); aoMudarCampo(el); return; }
  if (k === 'evo-ex') { location.hash = '#/evolucao/' + el.value; return; }
  if (k === 't-nome') { const t = treinoPorId(el.dataset.tid); if (t) { t.nome = el.value.trim() || 'Treino'; tocarPlano(); salvar(); } }
  if (k === 't-frente') { const t = treinoPorId(el.dataset.tid); if (t) { t.frente = el.value; tocarPlano(); salvar(); renderManter(); } }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.classList.contains('cnt-input')) ajustarLargura(el);
  if (el.dataset && el.dataset.bind === 'regulagem') { const f = acharEx(el.dataset.eid); if (f) { f.e.regulagem = el.value; tocarPlano(); salvar(); } el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }
  if (el.id === 'x-passo') marcarChips();
  if (el.id === 'x-nome') { const b = $('#btn-salvar-ex'); if (b) b.disabled = !el.value.trim(); }
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList && e.target.classList.contains('cnt-input')) e.target.blur(); });
function importar(file) {
  if (!file) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const d = JSON.parse(rd.result);
      if (!d.plan || !Array.isArray(d.plan.treinos)) throw 0;
      if (!confirm('Substituir os dados deste aparelho pelo backup?')) return;
      d.logs = d.logs || []; d.aulas = d.aulas || []; d.conclusoes = d.conclusoes || []; d.plan.meta = d.plan.meta > 0 ? d.plan.meta : 12;
      S = d; salvar(); location.hash = '#/hoje'; render();
    } catch (e) { alert('Arquivo de backup inválido.'); }
  };
  rd.readAsText(file);
}

/* ---------- sincronização (Supabase) ---------- */
function setSync(msg, erro) {
  syncMsg = msg; syncErro = !!erro;
  const el = $('#sync-status');
  if (el) { $('.txt', el).textContent = msg; el.classList.toggle('erro', !!erro); el.classList.toggle('connected', !erro && !!sync.access); }
}
function guardarSessao(base, j) {
  sync = { ...sync, ...base, access: j.access_token, refresh: j.refresh_token, expira: Date.now() + (j.expires_in - 60) * 1000, userId: (j.user && j.user.id) || sync.userId };
  lsSet(SYNC_KEY, JSON.stringify(sync));
}
async function garantirSessao() {
  if (!sync.access) throw new Error('Entre na conta em Ajustes.');
  if (Date.now() < (sync.expira || 0)) return;
  const r = await fetch(`${sync.url}/auth/v1/token?grant_type=refresh_token`, { method: 'POST', headers: { apikey: sync.key, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: sync.refresh }) });
  const j = await r.json();
  if (!r.ok) { sync.access = ''; lsSet(SYNC_KEY, JSON.stringify(sync)); throw new Error('Sessão expirada. Entre de novo em Ajustes.'); }
  guardarSessao({}, j);
}
const cab = () => ({ apikey: sync.key, Authorization: 'Bearer ' + sync.access, 'Content-Type': 'application/json' });
function mesclar(remoto) {
  if (!remoto || !remoto.plan) return;
  if ((remoto.plan.updatedAt || 0) > (S.plan.updatedAt || 0)) S.plan = { ...remoto.plan, meta: remoto.plan.meta > 0 ? remoto.plan.meta : 12 };
  for (const campo of ['logs', 'aulas', 'conclusoes']) {
    const mapa = new Map((S[campo] || []).map(x => [x.id, x]));
    for (const x of remoto[campo] || []) { const l = mapa.get(x.id); if (!l || (x.t || 0) > (l.t || 0)) mapa.set(x.id, x); }
    S[campo] = [...mapa.values()];
  }
}
async function sincronizar() {
  if (!sync.access) return;
  setSync('Sincronizando…');
  try {
    await garantirSessao();
    const g = await fetch(`${sync.url}/rest/v1/app_state?select=data&limit=1`, { headers: cab() });
    if (!g.ok) throw new Error('Não consegui ler os dados online. Confira se rodou o arquivo supabase.sql.');
    const rows = await g.json(), antes = JSON.stringify(S);
    if (rows.length) mesclar(rows[0].data);
    const mudou = JSON.stringify(S) !== antes;
    salvar(true);
    const p = await fetch(`${sync.url}/rest/v1/app_state?on_conflict=user_id`, { method: 'POST', headers: { ...cab(), Prefer: 'resolution=merge-duplicates,return=minimal' }, body: JSON.stringify({ user_id: sync.userId, data: S, updated_at: new Date().toISOString() }) });
    if (!p.ok) throw new Error('Não consegui enviar os dados online.');
    setSync('Sincronizado às ' + new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' }) + '.');
    const foco = document.activeElement && /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (mudou && !foco && !/^#\/(ex-editar|editar|ajustes)/.test(location.hash)) renderManter();
  } catch (e) { setSync(e.message === 'Failed to fetch' ? 'Sem conexão. Tento de novo depois.' : e.message, true); }
}
function agendarPush() { if (!sync.access) return; clearTimeout(pushTimer); pushTimer = setTimeout(sincronizar, 4000); }

/* ---------- início ---------- */
aplicarTema();
render();
if (sync.access) sincronizar();
document.addEventListener('visibilitychange', () => { if (!document.hidden && sync.access) sincronizar(); });
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
